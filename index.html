<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<!-- PWA — installable app packaging. The web app manifest lives in
     assets/ (only index.html + assets/ are served), so its icon paths
     are relative to assets/ and its start_url/scope step up one level
     ("../") to the page itself; that keeps the manifest correct both
     on the Muse host and on GitHub Pages. iOS Safari has no automatic
     install prompt: the Apple meta tags + apple-touch-icon below are
     what Share ->
<title>PhoneFactory — a CoyoTech production</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  /* Installed-PWA detection for the top shift below. iOS Safari's
     legacy standalone flag is covered here; standards-based browsers
     are covered by the (display-mode: standalone) media query in CSS.
     Runs in <head> so the class is set before first paint. */
  (function(){
    try{
      if(window.navigator.standalone === true ||
         (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)){
        document.documentElement.classList.add("is-standalone");
      }
    }catch(e){}
  })();
</script>
<style>
  :root{
    color-scheme: light dark;
    --pwa-shift:0px;
    --bar-bg:#ffffff; --bar-ink:#1d242e; --bar-muted:#66707c; --bar-line:#dde3dd;
    --pink:#ef8fab; --pink-deep:#d1406f;
    --green:#1e9e6a; --green-deep:#0c5c3c; --green-dark:#0a4630;
    --amber:#f0a500; --yellow:#ffd21f; --red:#e23b3b;
    --card:#ffffff; --card-ink:#1d242e; --chip:#eef1ec; --chip-muted:#44505c;
    --gen-ink:#d1406f; --strike:#e23b3b;
    --shadow:0 6px 18px rgba(6,40,26,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bar-bg:#141b22; --bar-ink:#eef2f0; --bar-muted:#a9bccb; --bar-line:#43586a;
      --card:#f7f5ef; --gen-ink:#ff9dbd; --strike:#ff7a7a;
    }
  }
  /* ===== standalone PWA top shift =====
     When installed (display-mode: standalone, incl. iOS standalone via
     the .is-standalone class set in <head>), pad the app down so the
     top bar sits just below the status-bar / Dynamic Island zone and
     the iOS blurry scroll-edge band that lives in it. History: a flat
     40px left the wallet row inside the blur (40px is INSIDE the
     safe area on modern iPhones); a flat 90px overshot — stacked on
     top of the status-bar area it left a quarter-screen green band
     and read as the bar floating low. The shift is now derived from
     the device's own safe-area-inset-top (47px notch / 59px Dynamic
     Island) plus a small 10px margin, floored at 56px for devices
     that report a small or zero inset — so the bar lands just below
     the blurry line on every phone instead of a one-size guess.
     In a normal browser tab --pwa-shift stays 0 and nothing moves.
     #app is box-sizing:border-box, so the shift is taken from the
     top of the flex column and the single-screen, no-scroll layout
     still fits exactly. The strip above the top bar shows the body's
     dark green background. */
  @media (display-mode: standalone){
    :root{ --pwa-shift:max(56px, calc(env(safe-area-inset-top, 0px) + 10px)); }
  }
  html.is-standalone{ --pwa-shift:max(56px, calc(env(safe-area-inset-top, 0px) + 10px)); }
  *{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;touch-action:manipulation;overscroll-behavior:none}
  /* ===== bottom gap: paint the CANVAS, not a strip inside #app =====
     Diagnosis (measured from the user's screenshots): across three
     builds with three different app-height mechanisms (100dvh chain,
     full-height fill, position:fixed inset:0) the bottom bar ended
     at the exact same pixel and the green strip below it was the
     exact same height (~48pt). The container's height was never the
     variable: in iOS standalone the CSS layout viewport itself lands
     short of the physical screen bottom, so EVERY in-page box —
     #app included, however it is sized — ends at the layout
     viewport's bottom edge, and the remaining strip is painted by
     the propagated root background (the body's dark green). No
     element inside #app can ever paint there, which is why the
     extension strip was clipped and inset:0 changed nothing.
     Fix: give <html> a background whose bottom band is the bottom
     bar's colour. The root background propagates to the whole
     canvas — full physical screen, below the layout viewport
     included — and is never clipped by #app's overflow:hidden.
     The green layer covers everything except the bottom 64px
     (taller than the measured ~48pt strip, shorter than the bar
     itself incl. its safe-area padding, so the seam always lands
     hidden inside the bar's own background), and the dark
     background-color fills that band and anything below the
     gradient if a browser sizes it against the root box instead
     of the canvas. Top is untouched: the gradient's green is the
     same --green-dark the body already showed above the top bar. */
  html{background-color:var(--bar-bg);
    background-image:linear-gradient(180deg,var(--green-dark),var(--green-dark));
    background-size:100% calc(100% - 64px);background-repeat:no-repeat;background-position:top center}
  body{margin:0;overflow:hidden;background:var(--green-dark);color:var(--bar-ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    user-select:none;-webkit-user-select:none;position:fixed;inset:0;width:100%}
  button{touch-action:manipulation;font:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  img{display:block;max-width:100%}
  svg{display:block}
  /* #app is anchored to the layout viewport's edges with
     position:fixed inset:0 instead of being sized by a height
     value: both height:100dvh and the height:100% chain
     (html → body → #app) rendered the app inset in the middle of
     the screen, while fixed inset:0 at least pins the flex column
     to the full layout viewport — top bar at the top (below the
     --pwa-shift padding), bottom bar at the layout viewport's
     bottom edge. NOTE: measured on device, that bottom edge is
     itself ~48pt short of the physical screen bottom in iOS
     standalone — see the html background note above for the
     canvas paint that carries the bar's colour the rest of the
     way. */
  /* Sizing: #app is sized by inset:0 ALONE (height:auto) — no
     viewport-unit height at all. The previous height:100lvh
     OVERSHOT: the large-viewport height is taller than the visible
     layout viewport in iOS standalone, so #app stretched past the
     screen's bottom edge and pushed the footer with it — the
     bar's buttons were clipped at their bottom edges. With
     top:0 + bottom:0 and height:auto, #app is exactly the layout
     viewport: the footer (flex:none, last child) sits fully
     inside it, buttons completely visible, and the footer's own
     background — safe-area padding included — fills down to
     #app's bottom edge. Any strip below the layout viewport on
     iOS is still painted the bar's colour by the propagated html
     canvas background above, so the dark bar reads as reaching
     the physical screen edge with no green strip below it. */
  #app{position:fixed;inset:0;height:auto;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--pwa-shift)}

  /* ===== top bar ===== */
  header.hud{flex:none;background:var(--bar-bg);color:var(--bar-ink);border-bottom:3px solid var(--green);position:relative;z-index:20}
  .hud-l1{display:flex;align-items:center;gap:8px;padding:5px 10px 0}
  .hud-title{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:21px;letter-spacing:.02em;line-height:1.05;white-space:nowrap}
  .hud-title .gen{color:var(--gen-ink);font-weight:700;font-size:16px}
  .hud-wallet{margin-left:auto;display:flex;align-items:center;gap:4px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--bar-muted);white-space:nowrap}
  .hud-wallet svg{width:15px;height:15px}
  .hud-strikes{font-size:14px;letter-spacing:3px;color:var(--strike);white-space:nowrap;line-height:1;margin-left:8px}
  .hud-l2{display:flex;align-items:center;gap:14px;padding:1px 10px 5px;font-variant-numeric:tabular-nums}
  .hud-stat{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .hud-stat svg{width:17px;height:17px;color:var(--bar-muted)}
  .hud-stat .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;line-height:1}
  .hud-stat .v.hot{color:var(--pink-deep)}
  .hud-quota{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
  .hud-quota svg{width:17px;height:17px;flex:none;color:var(--bar-muted)}
  .hud-quota .bar{flex:1;height:10px;border-radius:6px;background:var(--bar-line);overflow:hidden}
  .hud-quota .bar i{display:block;height:100%;width:0%;background:var(--pink-deep);border-radius:6px;transition:width .25s}
  .hud-quota .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;white-space:nowrap}

  /* ===== stage ===== */
  #stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#0e5c3d 0%,#0a4630 100%)}
  .stage-bg{position:absolute;inset:0;overflow:hidden;opacity:.30;pointer-events:none;background:#0a4630}
  /* ===== drone fly-through background video =====
     The v2 drone loop video (assets/drone-loop-v2.mp4): the same
     hall composition — central aisle, green benches, pink-overall
     workers — with an infinite horizon, flying forward endlessly.
     It fills .stage-bg edge to edge (object-fit:cover), muted,
     autoplay, looping, and plays at half speed: playbackRate 0.5
     is set in the script at the bottom of this file, so the 10s
     clip takes 20s per pass and the flight stays calm behind the
     gameplay. The .30 opacity on .stage-bg plus the shade above
     keep it readable. Under prefers-reduced-motion the video is
     hidden and the static hero image shows instead. */
  .stage-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  @media (prefers-reduced-motion: reduce){
    .stage-bg video{display:none}
    .stage-bg{background-image:url("assets/hero-factory.webp");background-size:cover;background-position:center 22%}
  }
  .stage-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,46,31,.42),rgba(7,46,31,.66) 46%,rgba(6,38,26,.92));pointer-events:none}
  .stage-in{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;padding:6px 8px 7px}
  #toast{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.9);z-index:30;
    background:var(--yellow);color:#231a00;font-family:"Barlow Condensed",sans-serif;font-weight:800;
    font-size:19px;letter-spacing:.03em;padding:4px 16px;border-radius:999px;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1)}
  #toast.bad{background:var(--red);color:#fff}
  #toast.good{background:var(--green);color:#fff}

  /* ===== phone order cards: many orders at once, pick who to save ===== */
  .phones{flex:none;display:flex;gap:6px}
  .phone{flex:1;min-width:0;background:var(--card);color:var(--card-ink);border:3px solid rgba(255,255,255,.35);
    border-radius:13px;padding:5px 6px 6px;text-align:left;position:relative;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:3px}
  .phone.focused{border-color:var(--yellow)}
  .phone.ready{border-color:var(--green);background:#e9f9ef}
  .phone.rush{background:#fff6d8}
  .phone.late{border-color:var(--red);background:#ffeded}
  .phone.late .p-val{background:var(--red);color:#fff}
  .phone .p-late{background:var(--red);color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:11px;letter-spacing:.06em;line-height:1;padding:3px 6px;border-radius:999px;white-space:nowrap;animation:pulse .7s infinite alternate}
  .phone .p-orig{font-size:11px;font-weight:700;color:var(--strike);text-decoration:line-through;white-space:nowrap}
  .phone .p-top{display:flex;align-items:center;gap:5px}
  .phone .p-val{background:var(--green);color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;line-height:1;padding:3px 7px;border-radius:999px;white-space:nowrap}
  .phone .p-sku{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--chip-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phone.rush .p-val{background:var(--amber);color:#2a1c00}
  .phone .p-ready{margin-left:auto;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  .phone .p-ready svg{width:13px;height:13px}
  .phone .p-rushdot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;animation:pulse .7s infinite alternate}
  .phone .seq{display:flex;flex-wrap:wrap;gap:3px}
  .phone .seq .pc{width:20px;height:20px;border-radius:6px;background:#e7e4da;color:#5f6b76;display:flex;align-items:center;justify-content:center}
  .phone .seq .pc svg{width:14px;height:14px}
  .phone .seq .pc.done{background:#bfe8cf;color:var(--green-deep)}
  .phone .seq .pc.have{background:var(--yellow);color:#4a3800;animation:pulse .55s infinite alternate}
  .phone .pat{height:7px;border-radius:5px;background:#e3ded0;overflow:hidden}
  .phone .pat i{display:block;height:100%;background:var(--green);border-radius:5px}
  .phone .pat i.low{background:var(--red)}
  .phone .pat i.late{background:var(--red)}
  .phone.empty{align-items:center;justify-content:center;border-style:dashed;box-shadow:none;background:rgba(255,255,255,.12);color:#cfe6d8;min-height:64px}
  .phone.empty svg{width:22px;height:22px;opacity:.6}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
  /* ===== final assembly: when a phone becomes ready, a finished
     powered-on front seals over the exposed parts (2D fallback;
     the 3D bench plays the same sequence in three.js) ===== */
  .fin-seal{transform-origin:52px 86px;animation:sealIn .95s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes sealIn{0%{opacity:0;transform:scale(1.14)}45%{opacity:1}100%{opacity:1;transform:scale(1)}}
  .fin-shine{animation:finShine .95s ease-out}
  @keyframes finShine{0%{transform:translateX(-42px);opacity:0}30%{opacity:.6}100%{transform:translateX(34px);opacity:.35}}
  .bench.celebrate::after{content:"";position:absolute;inset:6px;border:3px solid var(--yellow);border-radius:18px;
    pointer-events:none;animation:ringPulse 1.25s ease-out forwards}
  @keyframes ringPulse{0%{opacity:.95;transform:scale(.94)}100%{opacity:0;transform:scale(1.05)}}

  /* ===== bench: focused phone in 3D + Lin + two hands ===== */
  .bench{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .bench-phone{height:100%;max-height:100%;aspect-ratio:104/172;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));pointer-events:none}
  #bench3d{flex:1 1 auto;min-width:0;height:100%;position:relative;display:none;touch-action:none;pointer-events:auto;cursor:grab;outline:none}
  #bench3d:active{cursor:grabbing}
  #bench3d:focus-visible{box-shadow:inset 0 0 0 2px var(--yellow);border-radius:12px}
  #bench3d canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .rotate-hint{position:absolute;top:4px;right:4px;z-index:2;display:none;align-items:center;gap:5px;
    background:rgba(8,30,20,.55);color:#dff3e6;font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:3px 9px;border-radius:999px;pointer-events:none;transition:opacity .4s}
  .rotate-hint svg{width:13px;height:13px}
  .bench.has3d .rotate-hint{display:flex}
  .rotate-hint.gone{opacity:0}
  .bench.has3d #bench3d{display:block}
  .bench.has3d .bench-phone{display:none}
  .lin-chip{position:absolute;left:2px;bottom:0;height:min(88%,230px);width:auto;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  .hands{position:absolute;right:2px;bottom:2px;display:flex;gap:6px;z-index:3}
  .hand{width:46px;height:46px;border-radius:50%;border:2.5px dashed rgba(255,255,255,.55);background:rgba(10,20,16,.55);
    display:flex;align-items:center;justify-content:center;color:#cfe6d8;padding:0}
  .hand svg{width:24px;height:24px}
  .hand.full{border-style:solid;border-color:var(--yellow);background:#fdfcf7;color:var(--card-ink)}
  .hand:active{transform:scale(.93)}

  /* ===== timed stations: start, leave, beep when done ===== */
  .stations{flex:none;display:flex;gap:6px}
  .station{flex:1;background:#083322;border:2px solid #14603f;border-radius:12px;color:#dff3e6;
    display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px 6px;position:relative;overflow:hidden}
  .station svg{width:22px;height:22px}
  .station .s-name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#a9d8bd}
  .station .s-bar{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
  .station .s-bar i{display:block;height:100%;width:0%;background:var(--sky,#57b8d6);background:var(--yellow)}
  .station .s-count{position:absolute;top:3px;right:6px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:13px;color:var(--yellow)}
  .station.done{border-color:var(--green);background:#0d5c36;animation:stationFlash .5s infinite alternate}
  .station.done .s-name{color:#fff}
  @keyframes stationFlash{from{box-shadow:0 0 0 0 rgba(30,158,106,0)}to{box-shadow:0 0 0 5px rgba(30,158,106,.55)}}
  .station:active{transform:translateY(2px)}

  /* ===== parts tray ===== */
  .tray{flex:none;background:#083322;border:1px solid #14603f;border-radius:14px;padding:6px}
  .parts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .part{background:#fdfcf7;border:none;border-bottom:5px solid #cfccc0;border-radius:12px;color:var(--card-ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    padding:5px 2px 3px;min-height:54px;position:relative}
  .part svg{width:26px;height:26px}
  .parts.many .part{min-height:44px;padding-top:3px}
  .parts.many .part svg{width:21px;height:21px}
  .part span{font-size:10px;font-weight:700;line-height:1.1;color:#4c565f}
  .part .st-badge{position:absolute;top:3px;right:4px;width:15px;height:15px;border-radius:50%;background:var(--pink-deep);color:#fff;display:flex;align-items:center;justify-content:center}
  .part .st-badge svg{width:10px;height:10px}
  .part:active{transform:translateY(3px);border-bottom-width:2px}
  .part.wrong{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .fx{position:absolute;pointer-events:none;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;
    color:var(--yellow);text-shadow:0 2px 6px rgba(0,0,0,.55);animation:floatUp .9s ease-out forwards;z-index:40}
  @keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-52px) scale(1.15)}}
  @media (prefers-reduced-motion: reduce){
    .part.wrong,.phone .seq .pc.have,.phone .p-rushdot,.phone .p-late,.station.done,.fin-seal,.fin-shine,.bench.celebrate::after{animation:none}
    .bench.celebrate::after{display:none}
    .fx{animation-duration:.01s}.hud-quota .bar i{transition:none}
  }

  /* ===== bottom bar ===== */
  footer.bar{flex:none;margin-top:auto;display:flex;gap:7px;background:var(--bar-bg);border-top:1px solid var(--bar-line);
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));position:relative}
  /* The bar is anchored to the bottom of the flex column twice
     over: it is the last child AND has margin-top:auto, so it sits
     at #app's bottom edge even if the stage above it under-fills.
     Its own background — including the env(safe-area-inset-bottom)
     padding, which keeps the buttons clear of the home indicator —
     fills to #app's bottom edge. The remaining strip BELOW #app on
     iOS (layout viewport shorter than the physical screen; see the
     html background note at the top of this stylesheet) is painted
     this same colour by the propagated root background, so the
     bar's colour continues to the physical screen edge. No
     extension strip is used: anything painted past #app's box is
     clipped by its overflow:hidden and can never show there. */
  .btn-play{flex:1;background:var(--pink-deep);color:#fff;border:none;border-radius:12px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:21px;letter-spacing:.05em;padding:9px 10px}
  .btn-play svg{width:22px;height:22px}
  .btn-play:active{background:var(--green)}
  .btn-play.chain{background:var(--green)}
  .btn-play .chain-tag{background:var(--yellow);color:#231a00;font-size:14px;padding:1px 8px;border-radius:999px}
  .btn-icon{background:transparent;color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:12px;
    width:52px;display:flex;align-items:center;justify-content:center;padding:6px 0}
  .btn-icon svg{width:23px;height:23px}
  .btn-icon:active{background:#fdeef3}
  @media (prefers-color-scheme: dark){ .btn-icon:active{background:#3a2430} }

  /* ===== overlays ===== */
  .overlay{position:fixed;inset:0;background:rgba(6,24,17,.9);display:none;align-items:center;justify-content:center;padding:14px;padding-top:calc(14px + var(--pwa-shift));z-index:90}
  .overlay.show{display:flex}
  .card{background:var(--card);color:var(--card-ink);border-radius:18px;max-width:400px;width:100%;box-shadow:var(--shadow);overflow:hidden;max-height:94dvh;overflow-y:auto}
  .card .hero{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:center 26%;background:#0e3a2a}
  .card .pad{padding:13px 16px 16px;text-align:center}
  .card h3{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:32px;margin:0;line-height:1;text-transform:uppercase}
  .card .sub{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--pink-deep);letter-spacing:.08em;text-transform:uppercase;font-size:15px}
  .card .stats{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
  .card .stats div{flex:1;background:var(--chip);border-radius:11px;padding:7px 4px;font-size:11px;font-weight:700;color:var(--chip-muted);text-transform:uppercase;letter-spacing:.05em}
  .card .stats b{display:block;font-size:21px;font-family:"Barlow Condensed",sans-serif;color:var(--card-ink);letter-spacing:0;text-transform:none}
  .card .btn-row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .btn-card{background:var(--pink-deep);color:#fff;border:none;border-radius:12px;padding:11px 22px;
    font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;letter-spacing:.05em;
    display:inline-flex;align-items:center;gap:8px}
  .btn-card svg{width:19px;height:19px}
  .btn-card:active{background:var(--green)}
  .btn-card.ghost{background:var(--chip);color:var(--card-ink);box-shadow:inset 0 0 0 2px #c9cdc2}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;text-align:left;margin:10px 0 2px;font-size:13.5px;font-weight:600}
  .legend div{display:flex;align-items:center;gap:8px}
  .legend svg{width:24px;height:24px;flex:none}
  .gen-list{display:flex;flex-direction:column;gap:7px;margin:10px 0 2px}
  .gen-btn{display:flex;align-items:center;gap:10px;background:var(--chip);border:2px solid transparent;border-radius:12px;padding:9px 12px;text-align:left;color:var(--card-ink)}
  .gen-btn:active{border-color:var(--pink-deep)}
  .gen-btn .nm{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;line-height:1}
  .gen-btn .md{display:block;font-size:12.5px;color:var(--chip-muted);font-weight:600}
  .gen-btn .q{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;color:var(--green-deep);white-space:nowrap}
  .linimg{width:100%;height:auto;aspect-ratio:3/2;object-fit:contain;background:#f8f4ec;border-radius:11px;margin-top:10px}
  /* ===== How to play: single column, fills the phone screen, no scrolling =====
     Layout (top to bottom): lead image, title + instructions, workers
     image, Play button. The lead image is a full-width banner CROPPED
     to fit (object-fit:cover) — it fills the card edge to edge with no
     side bars. The workers image stays decorative below the
     instructions and above Play; it is the one flexible element, so on
     shorter phones it scales down (contain, whole sheet visible, cream
     background matching the sheet) instead of pushing Play off-screen
     or forcing the card to scroll. */
  #infoOverlay{padding:10px 8px;padding-top:calc(10px + var(--pwa-shift));align-items:stretch}
  /* height:100% of the overlay's content box (the overlay is fixed
     inset:0 with the shift already in its top padding) — no dvh,
     which measured short on device; the card fills the overlay
     exactly, top padding to bottom padding. */
  #infoOverlay .card{display:flex;flex-direction:column;height:100%;max-height:100%;overflow:hidden}
  #infoOverlay .hero{flex:0 0 auto;width:100%;max-width:100%;height:clamp(118px,21dvh,196px);aspect-ratio:auto;object-fit:cover;object-position:center 26%;background:#0e3a2a}
  #infoOverlay .pad{flex:0 0 auto;display:flex;flex-direction:column;padding:12px 16px 0}
  #infoOverlay h3{font-size:32px}
  #infoOverlay .legend{gap:8px 12px;margin:10px 0 0;font-size:14px;line-height:1.35}
  #infoOverlay .legend svg{width:24px;height:24px}
  #infoOverlay .linimg{flex:1 1 auto;min-height:0;width:100%;height:auto;aspect-ratio:auto;object-fit:contain;background:#f8f4ec;margin:10px 0 0;border-radius:0}
  #infoOverlay .btn-row{flex:0 0 auto;margin:0;padding:12px 16px 14px}
  #infoOverlay .btn-card{padding:11px 30px;font-size:20px}
  @media (max-height:880px){
    #infoOverlay .hero{height:clamp(104px,18dvh,160px)}
    #infoOverlay h3{font-size:27px}
    #infoOverlay .legend{font-size:13.5px;gap:6px 12px;margin-top:8px;line-height:1.3}
    #infoOverlay .pad{padding-top:10px}
    #infoOverlay .btn-row{padding:10px 16px 12px}
    #infoOverlay .btn-card{padding:10px 28px}
  }
  @media (max-height:700px){
    #infoOverlay .hero{height:clamp(84px,15dvh,120px)}
    #infoOverlay h3{font-size:26px}
    #infoOverlay .legend{font-size:12.5px;gap:5px 9px;margin-top:6px;line-height:1.3}
    #infoOverlay .legend svg{width:20px;height:20px}
    #infoOverlay .pad{padding:8px 13px 0}
    #infoOverlay .linimg{margin-top:6px}
    #infoOverlay .btn-row{padding:8px 13px 10px}
    #infoOverlay .btn-card{padding:8px 26px;font-size:19px}
  }
  /* upgrade shop */
  .shop-list{display:flex;flex-direction:column;gap:7px;margin:10px 0 2px}
  .upg{display:flex;align-items:center;gap:10px;background:var(--chip);border:2px solid transparent;border-radius:12px;padding:8px 11px;text-align:left;color:var(--card-ink);width:100%}
  .upg svg{width:28px;height:28px;flex:none;color:var(--pink-deep)}
  .upg .u-nm{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;line-height:1}
  .upg .u-md{display:block;font-size:12px;color:var(--chip-muted);font-weight:600}
  .upg .u-price{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:18px;color:var(--green-deep);white-space:nowrap}
  .upg.owned{border-color:var(--green);opacity:.85}
  .upg.owned .u-price{color:var(--green)}
  .upg.poor{opacity:.5}
  .wallet-line{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;color:var(--green-deep)}
</style>
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-l1">

        <span id="stWallet">¥0</span>

    </div>
    <div class="hud-l2">

        <div class="bar"><i id="stQuotaBar"></i></div>
        <span class="v"><span id="stCred">0</span>/<span id="stQuota">0</span></span>
      </div>
      <div class="hud-stat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2.5h6"/></svg>
        <span class="v" id="stClock">0:00</span>
      </div>
      <div class="hud-stat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11v9H3zM14 11h4l3 3v3h-7z"/><circle cx="7" cy="17" r="1.8"/><circle cx="17" cy="17" r="1.8"/></svg>
        <span class="v" id="stReady">0</span>
      </div>
    </div>
  </header>

  <main id="stage">
    <div class="stage-bg" aria-hidden="true"><video id="bgVideo" src="assets/drone-loop-v2.mp4" poster="assets/hero-factory.webp" muted loop autoplay playsinline preload="auto"></video></div>
    <div class="stage-shade" aria-hidden="true"></div>
    <div id="toast" role="status"></div>
    <div class="stage-in">
      <div class="phones" id="phones"></div>
      <div class="bench" id="bench">
        <div id="bench3d" tabindex="0" role="img" aria-label="The focused phone in 3D, assembling part by part as you deliver parts. Drag to rotate it; double-tap to face front again."></div>
        <div class="rotate-hint" id="rotateHint" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>Drag to rotate</div>
        <svg class="bench-phone" viewBox="0 0 104 172" role="img" aria-label="The focused phone, filling with parts as you deliver them">
          <defs>
            <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0e5c3d"/><stop offset="0.45" stop-color="#57b8d6"/><stop offset="1" stop-color="#ef8fab"/>
            </linearGradient>
          </defs>
          <rect x="6" y="4" width="92" height="164" rx="15" fill="#232a33" stroke="#5a6a76" stroke-width="2.5"/>
          <g id="phParts"></g>
          <g id="phFinish"></g>
          <rect x="30" y="156" width="44" height="5" rx="2.5" fill="#46545f"/>
        </svg>
        <img class="lin-chip" id="linImg" src="assets/lin-era1.webp" alt="Lin — the same young Chinese girl from the character sheet, in her pink CoyoTech uniform, hair net and mask, standing on her step-box" />
        <div class="hands" id="hands"></div>
      </div>
      <div class="stations" id="stations"></div>
      <div class="tray"><div class="parts" id="parts"></div></div>
    </div>
  </main>

  <footer class="bar">
    <button class="btn-play" id="btnMain">
      <span id="btnMainIcon"></span>
      <span id="btnMainLabel">Clock In</span>
      <span class="chain-tag" id="btnChain" style="display:none"></span>
    </button>
    <button class="btn-icon" id="btnMute" aria-pressed="false" aria-label="Sound on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="muteWaves" d="M15.5 8.5a5 5 0 0 1 0 7M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
    </button>
    <button class="btn-icon" id="btnInfo" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></svg>
    </button>
    <button class="btn-icon" id="btnMenu" aria-label="Generations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </footer>
</div>

<div class="overlay" id="overlay"><div class="card" id="overlayCard"></div></div>

<div class="overlay" id="infoOverlay">
  <div class="card">
    <img class="hero" src="assets/hero-factory.webp" alt="The CoyoTech hall: endless rows of young Chinese women in pink uniforms, hair nets and masks at green benches" />
    <div class="pad">
      <h3>How to play</h3>
      <div class="legend">
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round"><path d="M7 11V6a2 2 0 1 1 4 0v5V4a2 2 0 1 1 4 0v7V5a2 2 0 1 1 4 0v8c0 5-3 8-7 8s-6-2-8-6l-1.6-3.4A2 2 0 0 1 6 9.6z"/></svg>2 hands — carry 2 parts</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Station parts start in Gen 2</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round"><path d="M4 17V7l8-4 8 4v10"/><path d="M2 21h20"/></svg>Pink badge = station part — start it, go work</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21a2 2 0 0 0 4 0"/></svg>Green flash + beep = done</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round"><rect x="6" y="3" width="12" height="18" rx="3"/></svg>Tap a phone to deliver</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11v9H3zM14 11h4l3 3v3h-7z"/><circle cx="7" cy="17" r="1.8"/><circle cx="17" cy="17" r="1.8"/></svg>Ship 2–3 at once = chain ¥</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round"><path d="M4 20 20 4M20 4h-6M20 4v6"/></svg>Late = less ¥, then cancelled</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="#d1406f" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>Upgrades between generations</div>
      </div>
    </div>
    <img class="linimg" src="assets/lin-sheet.webp" alt="Lin across five eras — the same young Chinese girl in the pink CoyoTech uniform, getting younger with taller step-boxes" />
    <div class="btn-row"><button class="btn-card" id="btnCloseInfo">Play</button></div>
  </div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="card">
    <div class="pad">
      <div class="sub">CoyoTech · Line 7</div>
      <h3>Generations</h3>
      <div class="gen-list" id="genList"></div>
      <div class="btn-row">
        <button class="btn-card ghost" id="btnRestartGen">Restart</button>
        <button class="btn-card" id="btnCloseMenu">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  function ic(inner){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>'; }
  var CLOCK_BADGE = '<span class="st-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M9 3h6"/></svg></span>';

  /* Parts: kind "instant" = pick straight up into a hand.
     kind "station" = tapping starts its timed station; when the station
     beeps done, tap the station to collect the finished part.
     Gen 1 bundle: Screen and Battery are NOT separate parts there —
     they are never listed in the Gen 1 tray or on a Gen 1 ticket.
     Frame is the only listed step for that bundle (see
     LEVELS[0].frameBundle): when Frame is placed, the phone visual
     shows Frame + Screen + Battery together. In later generations Battery
     returns as its own station part; Screws is a normal instant
     part in every generation. */
  var PARTS = {
    frame:  {name:"Frame",   kind:"instant", icon:ic('<rect x="4" y="3" width="16" height="18" rx="3"/><rect x="7.5" y="6.5" width="9" height="11" rx="1.5"/>')},
    board:  {name:"Board",   kind:"instant", icon:ic('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 15h7M15 9h2"/><circle cx="17" cy="15" r="1.2"/>')},
    chip:   {name:"Chip",    kind:"instant", icon:ic('<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/>')},
    battery:{name:"Battery", kind:"station", station:"test", icon:ic('<rect x="3" y="8" width="15" height="9" rx="2"/><path d="M21 11v3"/><rect x="5.5" y="10.5" width="7" height="4" fill="currentColor" stroke="none"/>')},
    camera: {name:"Camera",  kind:"instant", icon:ic('<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/>')},
    antenna:{name:"Antenna", kind:"instant", icon:ic('<path d="M12 20v-8"/><circle cx="12" cy="9" r="1.4" fill="currentColor"/><path d="M7.5 5.5a6.5 6.5 0 0 1 9 0M5 3a10 10 0 0 1 14 0"/>')},
    gasket: {name:"Glue",    kind:"station", station:"cure", icon:ic('<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3"/>')},
    display:{name:"Display", kind:"station", station:"press", icon:ic('<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 17l6-9"/>')},
    sim:    {name:"SIM",     kind:"instant", icon:ic('<path d="M6 4h9l3 3v13H6z"/><circle cx="12" cy="13" r="2.6"/>')},
    screws: {name:"Screws",  kind:"instant", icon:ic('<circle cx="8" cy="8" r="3"/><path d="M8 5.8v4.4M5.8 8h4.4"/><circle cx="16.5" cy="16.5" r="3"/><path d="M16.5 14.3v4.4M14.3 16.5h4.4"/>')},
    seal:   {name:"Seal",    kind:"instant", icon:ic('<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/>')}
  };
  var TRAY = ["frame","board","chip","camera","battery","display","gasket","screws"];

  var STATIONS = {
    press:{ name:"Press", part:"display", dur:3.5, icon:ic('<path d="M4 4h16M6 4v5h12V4M12 9v4M8 21h8M12 13l-3 5h6z"/>') },
    cure: { name:"Cure",  part:"gasket",  dur:5.0, icon:ic('<circle cx="12" cy="14" r="4"/><path d="M12 3v3M5 6l2 2M19 6l-2 2M4 21h16"/>') },
    test: { name:"Test",  part:"battery", dur:4.0, icon:ic('<path d="M13 2 5 13.5h5L9.5 22 19 10h-5.5z"/>') }
  };

  var UPGRADES = [
    { id:"press", name:"Turbo Press",   md:"Press 3.5s → 2.0s",        price:300, icon:STATIONS.press.icon },
    { id:"cure",  name:"Fast Cure Lamp", md:"Cure 5s → 3s",            price:300, icon:STATIONS.cure.icon },
    { id:"test2", name:"Test Bench ×2", md:"Test 2 batteries at once", price:450, icon:STATIONS.test.icon },
    { id:"screw", name:"Power Driver",  md:"All stations 25% faster",  price:250, icon:ic('<path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/>') },
    { id:"swift", name:"Swift Lin",     md:"Orders wait 30% longer",   price:350, icon:ic('<path d="M13 2 5 13.5h5L9.5 22 19 10h-5.5z"/>') }
  ];

  /* Level design: pacing by generation — Gen 5 is the cap, there
     is no Gen 6. "Waiting" parts are the timed station parts
     (Battery / Display / Glue); every other part is instant.
       Gen 1: 3–4 parts, 0 waiting
       Gen 2: 3–5 parts, at most 1 waiting
       Gen 3: 4–5 parts, at most 2 waiting
       Gen 4: 4–6 parts, at most 2 waiting
       Gen 5: 5–6 parts, at most 3 waiting — max difficulty
     Gen 1 is PURE assembly — every part is an instant pick-up,
     nothing cooks, no stations on the floor at all. A Gen 1 phone starts
     as a CLEAN SLATE: nothing is pre-installed, the bench and ticket
     start empty. Frame is a normal listed step the player picks up and
     places — but in Gen 1 placing Frame also brings Screen + Battery
     into the phone visual (LEVELS[0].frameBundle): they appear
     alongside Frame on the bench (SVG + 3D) yet are never listed as
     separate steps on the ticket or in the tray. The only variation
     is the SKU: five Gen 1 variants that share the same core
     (Frame + Board + Screws) and differ by a part or two.
     Timed station parts first appear in Gen 2, capped at one per
     phone there, then the cap and the part count ramp per the table
     above. Each level declares its own tray and station list, so the
     Gen 1 tray shows no clock badges and no station row exists. */
  var LEVELS = [
    { name:"Gen 1", quota:600, time:90, patience:42, spawn:5.0, era:1,
      tray:["frame","board","chip","camera","antenna","screws"],
      stations:[],
      frameBundle:["screen","battery"],
      skus:["Lite","Cam","Pro","Air","Max"],
      templates:[
        ["frame","board","screws"],
        ["frame","board","camera","screws"],
        ["frame","board","chip","screws"],
        ["frame","board","antenna","screws"],
        ["frame","chip","camera","screws"]
      ]},
    { name:"Gen 2", quota:950, time:95, patience:36, spawn:4.8, era:1,
      tray:["frame","board","chip","camera","battery","display","gasket","screws"],
      stations:["test","press","cure"],
      templates:[
        ["frame","board","screws"],
        ["frame","board","battery","screws"],
        ["frame","board","chip","display","screws"],
        ["frame","board","camera","gasket","screws"]
      ]},
    { name:"Gen 3", quota:1350, time:95, patience:29, spawn:4.5, era:3,
      tray:["frame","board","chip","camera","battery","display","gasket","screws"],
      stations:["test","press","cure"],
      templates:[
        ["frame","board","battery","screws"],
        ["frame","board","camera","gasket","screws"],
        ["frame","board","battery","display","screws"]
      ]},
    { name:"Gen 4", quota:1750, time:100, patience:26, spawn:4.2, era:3,
      tray:["frame","board","chip","camera","battery","display","gasket","screws","sim","antenna","seal"],
      stations:["test","press","cure"],
      templates:[
        ["frame","board","chip","battery","screws"],
        ["frame","board","chip","display","gasket","screws"],
        ["frame","board","battery","display","sim","screws"]
      ]},
    { name:"Gen 5", quota:2100, time:100, patience:24, spawn:4.0, era:5,
      tray:["frame","board","chip","camera","battery","display","gasket","screws","sim","antenna","seal"],
      stations:["test","press","cure"],
      templates:[
        ["frame","board","battery","display","screws"],
        ["frame","board","battery","display","gasket","screws"],
        ["frame","board","camera","gasket","battery","screws"]
      ]}

    ready.forEach(function(p){
      if(p.late){ anyLate = true; sum += currentValue(p); /* late: reduced pay, no patience bonus */ }
      else sum += p.value + Math.round(30 * (p.patience/p.maxPatience));
    });

    ready.forEach(function(p){ if(p.id === S.focusedId) focusShipped = p; });
    S.phones = S.phones.filter(function(p){ return !p.ready; });

  var lastTs = null, uiAcc = 0;
  function loop(ts){
    if(S.mode !== "playing"){ lastTs = null; return; }
    if(!lastTs) lastTs = ts;
    if(S.paused){ lastTs = ts; requestAnimationFrame(loop); return; }
    var dt = Math.min(0.05, (ts - lastTs)/1000); lastTs = ts;
    var L = LEVELS[S.level];
    S.timeLeft -= dt;
    if(!S.rushDone && S.timeLeft < L.time*0.55){
      S.rushDone = true;
      toast("KEYNOTE RUSH!", "");

      spawnPhone(true); spawnPhone(true);
    }
    S.spawnIn -= dt;
    if(S.spawnIn <= 0){ spawnPhone(false); S.spawnIn = L.spawn * (0.8 + Math.random()*0.5); }
    /* stations cook while you work elsewhere */
    var stationChanged = false;
    Object.keys(S.stations).forEach(function(k){
      S.stations[k].items.forEach(function(it){
        if(it.state === "cook"){

        }

    });

    var dead = [], wentLate = false;
    S.phones.forEach(function(p){
      if(p.ready) return; /* boxed phones don't get cancelled — but they hold their slot */
      if(!p.late){
        p.patience -= dt;
        if(p.patience <= 0){
          /* deadline breached: NOT cancelled yet — the order goes
             late and enters its grace period at reduced pay */
          p.patience = 0;
          p.late = true;
          p.lateDur = p.maxPatience * LATE_GRACE;
          p.lateLeft = p.lateDur;

        p.lateLeft -= dt;

      toast("Order late — reduced ¥", "bad");
      renderPhones();
    }
    dead.forEach(cancelOrder);
    if(S.mode !== "playing"){ renderAll(); return; }
    if(S.timeLeft <= 0){
      endLevel(S.genCred >= L.quota);
      return;
    }
    renderStats();
    uiAcc += dt;
    if(uiAcc >= 0.25){ uiAcc = 0; updatePatience(); updateStationBars(); if(stationChanged) renderStations(); }

        if(f===2){ g.fillRect(10,16,108,17); g.fillRect(10,50,108,8); g.fillRect(10,74,108,8); }
        if(f===3){ g.fillStyle = "rgba(130,150,170,0.4)"; g.fillRect(0,88,128,40); }

      var sway = Math.sin(t * 0.6) * 0.16;
      group.rotation.y = sway + curYaw + flipExtra;
      group.rotation.x = 0.1 + Math.sin(t * 0.43) * 0.03 + curPitch;
      group.position.x = 0;
      group.position.y = Math.sin(t * 0.9) * 0.045 + asmBounce;
      group.scale.setScalar(1 + ((showFinish && asmP < 1) ? 0.05 * Math.sin(asmP * Math.PI) : 0));
      shine.intensity = 0.55;
      displayMat.emissive.setRGB(0, 0, 0);
      if(spinning){
        var p = (t - shipAt) / 0.9;
        group.rotation.y = sway + curYaw + easeOutCubic(p) * Math.PI * 2;
        group.position.y = Math.sin(p * Math.PI) * 0.28;
        shine.intensity = 0.55 + 5.5 * Math.sin(p * Math.PI);
        displayMat.emissive.setRGB(0.12, 0.25, 0.32);
      }
      /* shine sweep */
      var sp = (t - sweepAt) / sweepDur;
      if(sp >= 0 && sp <= 1){
        sweep.visible = true;
        sweep.position.x = -2.1 + 4.2 * sp;
        sweep.material.opacity = 0.9 * Math.sin(sp * Math.PI);
        if(!spinning) shine.intensity = 0.55 + 3.2 * Math.sin(sp * Math.PI);
      } else sweep.visible = false;
      /* sparkles */
      var bp = (t - burstAt) / 1.15;
      if(bp >= 0 && bp <= 1){
        sparks.visible = true;
        sparks.material.opacity = Math.sin(bp * Math.PI) * 0.95;
        sparks.position.y = bp * 0.6;
        sparks.rotation.y = bp * 1.4;
        sparks.scale.setScalar(1 + bp * 0.35);
      } else sparks.visible = false;
      /* sealing front: flies in from the front during the first
         half of the sequence while the whole internal stack sinks
         INTO the frame (seatSink), then sits seated as the finished,
         powered-on face of one solid phone — its back face (0.13)
         rests 0.01 above the sunken screen's front face (0.12):
         close enough to read as one slab, never touching, so the
         two faces cannot z-fight */
      finishPanel.visible = showFinish;
      var seatSink = 0, seatE = 0;
      if(showFinish){
        var fe = reducedMotion ? 1 : easeOutCubic(Math.max(0, Math.min(1, (asmP - 0.1) / 0.5)));
        seatE = fe;
        finishPanel.position.z = 0.155 + (1 - fe) * 2.3;
        finishPanel.position.y = (1 - fe) * 0.5;
        finishPanel.scale.setScalar(0.97 + 0.03 * fe);
        setOpacity(finishPanel, fe * 0.99);
        finishStreak.material.opacity = 0.35 * fe;
        /* sink 0.22: the sunken screen's front face lands at 0.12,
           the panel's back face at 0.13 — a clean 0.01 air gap, the
           panel fully in front of every internal layer */
        seatSink = 0.22 * fe;
        if(asmP < 1) shine.intensity = 0.55 + 3.0 * Math.sin(asmP * Math.PI);
      }
      /* once the front is fully seated the phone is closed: hide the
         internals outright (frame + screen stay) so nothing inside
         can shimmer through or around the panel at glancing angles */
      var hideInternals = showFinish && seatE >= 0.985;

      /* ===== X-ray view during assembly =====
         The outer shell — Frame, the bundled Screen and the Display
         part — is the phone's casing: fitted early, it would hide
         every part placed underneath it (the Screen / Display slabs
         sit in FRONT of the board, chip, battery and camera in z),
         and the solid frame body hides everything from behind when
         the phone is rotated. So while a phone is still being built,
         its shell renders translucent, depth-write off and drawn
         after the internals (renderOrder 10 in the loop below):
         every fitted part stays individually visible whatever order
         it went in and whatever angle the phone is turned to. As the
         final-assembly sequence seats the finished front (seatE
         0 → 1), the shell fades back to fully solid and stays solid
         while the phone waits to ship and through the ship spin. */
      var shellSolid = showFinish ? seatE : 0;
      frameEdgeMat.opacity = 0.9 - 0.55 * shellSolid;
      screenEdgeMat.opacity = 0.8 - 0.45 * shellSolid;
      displayEdgeMat.opacity = 0.75 - 0.4 * shellSolid;

      Object.keys(meshes).forEach(function(name){
        var m = meshes[name];
        var isPlaced = placedList.indexOf(name) !== -1;
        var isNext = (name === nextPart);
        var isShell = (name === "frame" || name === "screen" || name === "display");
        if(isPlaced && !wasPlaced[name] && !spinning) placedAt[name] = t;
        wasPlaced[name] = isPlaced;
        m.visible = isPlaced || isNext;
        if(hideInternals && name !== "frame" && name !== "screen") m.visible = false;
        if(!m.visible) return;
        var rp = m.userData.restP, rr = m.userData.restR;
        if(isPlaced){
          var age = t - (placedAt[name] || 0);
          if(age < 0.55 && !spinning){
            /* smooth fly-in: glides in from the side, turning level,
               with a soft overshoot settle as it seats */
            var e = easeOutCubic(age / 0.55);
            var bk = easeOutBack(age / 0.55);
            var f = m.userData.fly;
            m.position.set(rp.x + f.x*(1-e), rp.y + f.y*(1-e), rp.z + f.z*(1-e));
            m.rotation.set(rr.x + (1-e)*-0.55, rr.y + (1-e)*1.05, rr.z + (1-e)*0.3);
            m.scale.setScalar(Math.max(0.3, Math.min(1.1, 0.55 + 0.45 * bk)));
          } else {
            m.position.copy(rp);
            m.rotation.set(rr.x, rr.y, rr.z);
            m.scale.setScalar(1);
          }
          /* final assembly: every placed part except the frame
             itself sinks into the frame as the sealing front seats,
             so the completed phone is one solid slab */
          if(name !== "frame" && seatSink) m.position.z -= seatSink;
          /* shell parts fade between their X-ray opacity and their
             full base opacity as the phone is sealed (shellSolid);
             internal parts always render at full opacity */
          var placedOp = m.userData.baseOp;
          if(isShell){
            var xrayOp = (name === "frame") ? 0.2 : (name === "screen" ? 0.32 : 0.24);
            placedOp = xrayOp + (m.userData.baseOp - xrayOp) * shellSolid;
          }
          setOpacity(m, placedOp, isShell ? 10 : 0);
        } else {
          var pulse = 0.3 + 0.2 * Math.sin(t * 6);
          m.position.copy(rp);
          m.rotation.set(rr.x, rr.y, rr.z);
          m.scale.setScalar(1 + 0.03 * Math.sin(t * 6));
          setOpacity(m, pulse * m.userData.baseOp, isShell ? 10 : 0);
        }
      });
      renderer.render(scene, camera);
    }
    requestAnimationFrame(tick);

    return {
      syncWith: function(phone){
        state.seq = phone ? phone.seq.slice() : [];
        state.done = phone ? phone.done.slice() : [];
        var complete = phone && phone.seq.length > 0 && phone.done.length >= phone.seq.length;
        if(complete && state.completeKey !== phone.id){
          state.completeKey = phone.id;
          /* kick off the final-assembly sequence: sealing front
             flies in, phone flips once, shine sweep + sparkles */
          assembleAt = nowS();
          triggerFx(0.9);
        }
        if(!complete) state.completeKey = null;
      },
      fumble: function(){},
      celebrate: function(seq){ shipSeq = seq.slice(); shipAt = nowS(); triggerFx(0.9); }
    };
  })();
  /* Background drone video: half speed (0.5x), muted, looping.
     playbackRate is (re)applied on loadedmetadata in case the
     browser resets it, and play() is nudged in case autoplay was
     deferred; the muted + playsinline attributes keep autoplay
     allowed on iOS. */
  (function(){
    var v = $("bgVideo");
    if(!v) return;
    function slow(){
      try{ v.playbackRate = 0.5; }catch(e){}
      var p = v.play();
      if(p && p.catch) p.catch(function(){});
    }
    if(v.readyState >= 1) slow();
    v.addEventListener("loadedmetadata", slow);
  })();

  setLin(0);
  renderTray();
  renderAll();
})();
</script>
<script>
/* PWA: register the service worker that caches the game shell. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
